[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-bot"
version = "0.1.0"
description = "AI-powered Anki deck workspace — YAML source to .apkg build pipeline"
requires-python = ">=3.12"
dependencies = [
    "genanki>=0.13,<1.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]
